[project]
name = "quran-school"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alghofaily", email = "a.s.alghofaily@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.14.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]